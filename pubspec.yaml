name: englearn
description: "Game Edukasi Bahasa Inggris untuk SD - Capstone Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # ☁️ Backend & Sync
  supabase_flutter: ^2.3.0
  
  # ✨ Animasi Playful
  flutter_animate: ^4.3.0
  
  # 🔊 Audio & Speech (untuk modul Speaking)
  audioplayers: ^5.2.0
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.1

  # 💾 Local Storage (offline-first)
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 📱 Device Info (buat ID unik player)
  device_info_plus: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  # 🎨 Fonts (download dari Google Fonts)
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fontspring-demo-zuumerough-regular.otf
        # - asset: assets/fonts/Fredoka-Regular.ttf
        # - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Pacifico
      fonts:
        # - asset: assets/fonts/Pacifico-Regular.ttf
  
  # 🖼️ Assets
  assets:
    - assets/images/ENGLearn.png          # Background HomeScreen
    - assets/images/level_map_screen.png      # Background LevelMap (nanti)
    # - audio/correct.mp3            # Sound effect benar
    # - audio/wrong.mp3              # Sound effect salah
    # - audio/level_complete.mp3     # Sound level selesai