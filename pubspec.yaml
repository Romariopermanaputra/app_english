name: englearn
description: "Game Edukasi Bahasa Inggris untuk SD - Capstone Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # ☁️ Backend & Sync
  supabase_flutter: ^2.3.0
  
  # ✨ Animasi Playful
  flutter_animate: ^4.3.0
  
  # 🔊 Audio & Speech (untuk modul Speaking)
  audioplayers: ^5.2.0
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.1

  # 💾 Local Storage (offline-first)
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 📱 Device Info (buat ID unik player)
  device_info_plus: ^9.1.1
  google_fonts: ^8.1.0
  # untuk membatasi soal 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
flutter:
  uses-material-design: true
  
  # 🎨 Fonts — dikomentar karena file belum ada
  # fonts:
  #   - family: Fredoka
  #     fonts:
  #       - asset: assets/fonts/fontspring-demo-zuumerough-regular.otf
  #         weight: 700
  #   - family: Pacifico
  #     fonts:
  #       - asset: assets/fonts/Pacifico-Regular.ttf
  
  # 🖼️ Assets
  assets:
    - assets/images/
    - assets/audio/